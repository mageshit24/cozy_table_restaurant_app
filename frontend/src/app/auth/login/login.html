<div class="auth-shell">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="brand-icon">🍽️</span>
      <span class="brand-name">The Cozy Table</span>
    </div>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Log in to book a table or pick up where you left off.</p>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
