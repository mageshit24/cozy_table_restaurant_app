<div class="auth-shell">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="brand-icon">🍽️</span>
      <span class="brand-name">The Cozy Table</span>
    </div>
    <h2>Create your account</h2>
    <p class="auth-subtitle">Join to book tables and order ahead.</p>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Enter full name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="phone" name="phone" required placeholder="Enter 10-digit phone number" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter password" />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
            placeholder="Confirm password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
