<div class="feedback-page page-wrapper">
  <div class="feedback-container card">
    <h2>Give Your Feedback</h2>
    <p class="subtitle">Tell us how your visit went — it helps the kitchen and the floor team.</p>
    <div class="ticket-rule"></div>

    <form (ngSubmit)="submitFeedback()">

      <div class="form-group">
        <label for="rating">Rating</label>
        <select id="rating" [(ngModel)]="rating" name="rating">
          <option *ngFor="let r of [1,2,3,4,5]" [value]="r">
            {{ r }} Star{{ r > 1 ? 's' : '' }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="comment">Comment</label>
        <textarea id="comment" [(ngModel)]="comment" name="comment" rows="4" placeholder="Write your feedback..."
          required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Submit Feedback</button>
    </form>

    <p class="message" *ngIf="message" [class.message-error]="message.includes('Failed')">{{ message }}</p>
  </div>
</div>
